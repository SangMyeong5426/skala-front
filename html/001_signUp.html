<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 페이지</title>
    <link rel="stylesheet" href="../css/style_signUp.css">
</head>
<body>
    <header>
        <h1>회원가입</h1>
        <p>SKALA-FRONT 회원가입을 환영합니다.</p>
    </header>

    <main>
        <form action="../html/001_signUpResult.html" method="get">
            <fieldset>
                <legend>계정 정보</legend>
                <p>
                    <label for="userId">아이디: </label>
                    <input type="text" id="userId" name="userId" minlength="4" maxlength="12" pattern="[a-zA-Z0-9]{4,12}" placeholder="4~12자 영문/숫자" title="영문과 숫자 조합으로 4~12자 이내로 입력해주세요." required>
                    <small>(필수)</small>
                </p>
                <p>
                    <label for="userPw">비밀번호: </label>
                    <input type="password" id="userPw" name="userPw" minlength="8" placeholder="8자 이상 입력" required>
                    <small>(필수)</small>
                </p>
                <p>
                    <label for="userEmail">이메일: </label>
                    <span class="email-inputs">
                        <input type="text" id="emailLocalPart" placeholder="아이디" pattern="[A-Za-z0-9._%+-]+" title="영문/숫자와 ._%+- 로 이루어진 아이디 부분만 입력해주세요." disabled>
                        <input type="email" id="userEmail" name="userEmail" placeholder="example@domain.com" pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" title="example@domain.com 형식으로 입력해주세요 (도메인에 .com 등 최상위 도메인 포함)." required>
                        <select id="emailDomainSelect">
                            <option value="direct" selected>직접 입력</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="daum.net">daum.net</option>
                        </select>
                    </span>
                    <small>(필수)</small>
                </p>
            </fieldset>

            <fieldset>
                <legend>개인 프로필 정보</legend>
                <p>
                    <label for="userName">이름: </label>
                    <input type="text" id="userName" name="userName" placeholder="본인의 이름을 입력" required>
                    <small>(필수)</small>
                </p>
                <p>
                    <label for="userTel">전화번호: </label>
                    <input type="tel" id="userTel" name="userTel" pattern="010-[0-9]{4}-[0-9]{4}" placeholder="010-0000-0000" title="010-0000-0000 형식으로 입력해주세요.">
                </p>
                <p>
                    <label for="userBirth">생년월일: </label>
                    <input type="date" id="userBirth" name="userBirth" min="1900-01-01" max="2026-07-16">
                </p>
                <p>
                    <label for="region">지역: </label>
                    <select id="region" name="region">
                        <option value="">선택하세요</option>
                        <option value="서울">서울</option>
                        <option value="인천">인천</option>
                        <option value="경기">경기</option>
                        <option value="광주">광주</option>
                        <option value="부산">부산</option>
                        <option value="대구">대구</option>
                        <option value="대전">대전</option>
                        <option value="기타 지역">기타 지역</option>
                    </select>
                </p>
                <p>
                    성별:
                    <span class="chip-group">
                        <label><input type="radio" name="gender" value="남성" checked> 남성</label>
                        <label><input type="radio" name="gender" value="여성"> 여성</label>
                        <label><input type="radio" name="gender" value="선택안함"> 선택안함</label>
                    </span>
                </p>
                <p>
                    관심 분야 (중복 선택 가능):
                    <span class="chip-group">
                        <label><input type="checkbox" name="interest" value="Frontend"> 웹 프론트엔드 (Vue.js/HTML)</label>
                        <label><input type="checkbox" name="interest" value="UI/UX"> UI/UX 디자인 표준</label>
                        <label><input type="checkbox" name="interest" value="Backend"> 백엔드 & 데이터베이스</label>
                        <label><input type="checkbox" name="interest" value="Devops"> 클라우드 & 인프라</label>
                        <label><input type="checkbox" name="interest" value="AgentDev"> Agent 개발</label>
                        <label><input type="checkbox" name="interest" value="AX"> AX</label>
                    </span>
                </p>
            </fieldset>

            <fieldset>
                <legend>자기소개</legend>
                <p>
                    <label for="intro">나를 표현하는 한 줄 소개 또는 가입 인사:</label><br>
                    <textarea id="intro" name="intro" rows="5" cols="40" maxlength="200" placeholder="여기에 내용을 입력하세요 (최대 200자)"></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>약관 동의</legend>
                <p class="terms-row">
                    <label>
                        <input type="checkbox" name="terms" value="agree" required>
                        이용약관 및 개인정보 수집·이용에 동의합니다. <small>(필수)</small>
                    </label>
                </p>
            </fieldset>

            <div class="form-actions">
                <input type="submit" class="btn btn-primary" value="동의하고 회원가입">
                <input type="reset" class="btn btn-secondary" value="다시 작성">
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 SKALA-FRONT. All rights reserved.</p>
    </footer>

    <script>
        const emailLocalPart = document.getElementById('emailLocalPart');
        const userEmail = document.getElementById('userEmail');
        const emailDomainSelect = document.getElementById('emailDomainSelect');

        function syncEmailFromDomain() {
            userEmail.value = `${emailLocalPart.value}@${emailDomainSelect.value}`;
        }

        emailLocalPart.addEventListener('input', syncEmailFromDomain);

        emailDomainSelect.addEventListener('change', function () {
            if (this.value === 'direct') {
                emailLocalPart.disabled = true;
                userEmail.readOnly = false;
                userEmail.value = '';
                userEmail.focus();
            } else {
                emailLocalPart.disabled = false;
                userEmail.readOnly = true;
                syncEmailFromDomain();
                emailLocalPart.focus();
            }
        });
    </script>
</body>
</html>
