<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrap-up Quiz</title>

    <style>
        .option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;
        }

        .option:hover {
            background-color: #f2f2f2;
        }

        .option.correct {
            background-color: #d4edda;
            border-color: #28a745;
        }

        .option.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <h1>📝 HTML · CSS · JS Wrap-up Quiz</h1>

    <p id="progress">문제 1 / 5</p>
    <h2 id="questionText"></h2>
    <div id="optionsBox"></div>

    <p id="resultBox"></p>
    <button id="restartBtn" style="display:none;">다시 풀기</button>

    <script>
        // 클릭형 퀴즈로 HTML/CSS/JS 를 점검하는 배열+객체 데이터
        const quizList = [
            {
                question: "HTML에서 화면에 보이지 않는 메타 정보를 담는 태그는?",
                options: ["<body>", "<head>", "<footer>", "<main>"],
                answerIndex: 1
            },
            {
                question: "CSS에서 요소 사이의 바깥 여백을 지정하는 속성은?",
                options: ["padding", "border", "margin", "gap"],
                answerIndex: 2
            },
            {
                question: "Flexbox에서 방향을 세로로 바꾸는 속성값은?",
                options: ["flex-direction: row", "flex-direction: column", "display: grid", "position: fixed"],
                answerIndex: 1
            },
            {
                question: "JavaScript에서 요소의 텍스트를 바꿀 때 사용하는 것은?",
                options: ["element.href", "element.textContent", "element.src", "element.type"],
                answerIndex: 1
            },
            {
                question: "이벤트를 연결할 때 사용하는 JavaScript 메서드는?",
                options: ["addEventListener", "querySelector", "getElementById", "createElement"],
                answerIndex: 0
            }
        ];

        let currentIndex = 0;
        let score = 0;

        const progressEl = document.getElementById("progress");
        const questionEl = document.getElementById("questionText");
        const optionsBox = document.getElementById("optionsBox");
        const resultBox = document.getElementById("resultBox");
        const restartBtn = document.getElementById("restartBtn");

        function renderQuestion() {
            const current = quizList[currentIndex];
            progressEl.textContent = `문제 ${currentIndex + 1} / ${quizList.length}`;
            questionEl.textContent = current.question;
            resultBox.textContent = "";
            optionsBox.innerHTML = "";

            current.options.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.className = "option";
                btn.textContent = optionText;
                btn.addEventListener("click", () => selectAnswer(index, btn));
                optionsBox.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const current = quizList[currentIndex];
            const allOptionBtns = optionsBox.querySelectorAll(".option");

            allOptionBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === current.answerIndex) {
                selectedBtn.classList.add("correct");
                resultBox.textContent = "정답입니다! ✅";
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                allOptionBtns[current.answerIndex].classList.add("correct");
                resultBox.textContent = "오답입니다. ❌";
            }

            setTimeout(goNext, 900);
        }

        function goNext() {
            currentIndex++;
            if (currentIndex < quizList.length) {
                renderQuestion();
            } else {
                showFinalScore();
            }
        }

        function showFinalScore() {
            progressEl.textContent = "퀴즈 종료";
            questionEl.textContent = `총 ${quizList.length}문제 중 ${score}문제를 맞혔습니다.`;
            optionsBox.innerHTML = "";
            resultBox.textContent = "";
            restartBtn.style.display = "inline-block";
        }

        restartBtn.addEventListener("click", () => {
            currentIndex = 0;
            score = 0;
            restartBtn.style.display = "none";
            renderQuestion();
        });

        renderQuestion();

        // TODO: quizList 에 문제를 추가/수정하고 정답 인덱스(answerIndex)도 맞춰보세요
    </script>
</body>
</html>
