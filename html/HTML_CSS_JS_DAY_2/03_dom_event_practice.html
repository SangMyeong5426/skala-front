<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM · Event 실습</title>

    <style>
        .highlighted {
            background-color: #fff3cd;
            color: #c0392b;
        }

        .todo-delete-btn {
            margin-left: 12px;
        }

        li {
            margin-bottom: 3px;
        }

    </style>
</head>
<body>
    <h1>DOM · Event 실습</h1>

    <h2>① 텍스트 변경</h2>
    <p id="message">원래 문구입니다.</p>
    <input type="text" id="messageInput" placeholder="바꿀 문구를 입력하세요">
    <button id="changeTextBtn">텍스트 바꾸기</button>

    <hr>

    <h2>② classList 로 스타일 토글</h2>
    <p id="toggleBox">이 문단에 강조 스타일을 켜고 끌 수 있습니다.</p>
    <button id="toggleClassBtn">강조 토글</button>

    <hr>

    <h2>③ 입력값 읽어서 목록 추가/삭제</h2>
    <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
    <button id="addBtn">추가</button>
    <button id="clearAllBtn">전체 삭제</button>
    <ul id="todoList"></ul>

    <script>
        const messageEl = document.getElementById("message");
        const messageInput = document.getElementById("messageInput");
        const changeTextBtn = document.getElementById("changeTextBtn");

        changeTextBtn.addEventListener("click", () => {
            const value = messageInput.value.trim();
            if (value === "") {
                return;
            }

            messageEl.textContent = value;
            messageInput.value = "";
        });

        const toggleBox = document.getElementById("toggleBox");
        const toggleClassBtn = document.getElementById("toggleClassBtn");

        toggleClassBtn.addEventListener("click", () => {
            toggleBox.classList.toggle("highlighted");
        });

        const todoInput = document.getElementById("todoInput");
        const addBtn = document.getElementById("addBtn");
        const clearAllBtn = document.getElementById("clearAllBtn");
        const todoList = document.getElementById("todoList");

        addBtn.addEventListener("click", () => {
            const value = todoInput.value.trim();
            if (value === "") {
                return;
            }

            const li = document.createElement("li");
            li.textContent = value;

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "삭제";
            deleteBtn.classList.add("todo-delete-btn");
            deleteBtn.addEventListener("click", () => {
                li.remove();
            });

            li.appendChild(deleteBtn);
            todoList.appendChild(li);

            todoInput.value = "";
        });

        clearAllBtn.addEventListener("click", () => {
            todoList.innerHTML = "";
        });
    </script>
</body>
</html>
