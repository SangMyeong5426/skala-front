<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 할 일 관리</title>
    <link rel="stylesheet" href="../../../../CSS/style_todoApp.css">
</head>
<body>
    <main class="todo-app">
        <header class="todo-header">
            <h1>오늘의 할 일</h1>
        </header>

        <section class="calendar">
            <div class="calendar-nav">
                <button type="button" id="prevMonth" aria-label="이전 달">&#10094;</button>
                <h2 id="calTitle"></h2>
                <button type="button" id="nextMonth" aria-label="다음 달">&#10095;</button>
            </div>
            <div class="calendar-weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div id="calGrid" class="calendar-grid"></div>
        </section>

        <h2 id="dateTitle" class="date-title"></h2>
        <p id="feedbackMsg" class="feedback-msg"></p>

        <form id="todoForm" class="todo-form">
            <input id="todoInput" type="text" placeholder="할 일을 입력하세요" autocomplete="off" />
            <button type="submit">추가</button>
        </form>

        <div class="filters">
            <button type="button" class="filter-btn active" data-filter="all">전체 <span class="filter-count" data-count-for="all">0</span></button>
            <button type="button" class="filter-btn" data-filter="active">진행중 <span class="filter-count" data-count-for="active">0</span></button>
            <button type="button" class="filter-btn" data-filter="done">완료 <span class="filter-count" data-count-for="done">0</span></button>
        </div>

        <ul id="todoList" class="todo-list"></ul>
        <div id="emptyMsg" class="empty" hidden>
            <svg class="empty-icon" viewBox="0 0 64 64" width="52" height="52" fill="none" aria-hidden="true">
                <circle cx="32" cy="32" r="29" stroke="currentColor" stroke-width="2" opacity="0.25"/>
                <path d="M20 33l8 8 16-16" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p id="emptyText" class="empty-text"></p>
        </div>

        <p id="summaryText" class="todo-summary"></p>
    </main>

    <footer class="site-footer">
        <p class="footer-brand">✅ SKALA TODO</p>
        <p class="footer-note">이 페이지는 SKALA 프론트엔드 과정 실습으로 제작되었습니다.</p>
        <p>&copy; 2026 박상명. All rights reserved.</p>
    </footer>

    <script type="module" src="../../../../js/todo/app.js"></script>
</body>
</html>
